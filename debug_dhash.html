<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>dHash Debugger</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
        }

        img {
            max-width: 200px;
            border: 1px solid #ccc;
            margin: 5px;
        }

        .pair {
            display: flex;
            align-items: flex-start;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
        }

        .info {
            margin-left: 20px;
        }

        .diff {
            color: red;
            font-weight: bold;
        }

        .match {
            color: green;
        }
    </style>
</head>

<body>
    <h1>dHash Debugger</h1>
    <div id="container"></div>

    <script>
        // Copy of the function from DHash.coffee (translated to JS)
        function computeHash(img) {
            const c = document.createElement('canvas');
            c.width = 9;
            c.height = 8;
            const ctx = c.getContext('2d');
            ctx.drawImage(img, 0, 0, 9, 8);
            const data = ctx.getImageData(0, 0, 9, 8).data;

            let hash = '';
            let hashIndex = 0;
            let currentInt = 0;

            for (let y = 0; y < 8; y++) {
                for (let x = 0; x < 8; x++) {
                    const offset = (y * 9 + x) * 4;
                    const px1 = (data[offset] + data[offset + 1] + data[offset + 2]) / 3;
                    const px2 = (data[offset + 4] + data[offset + 5] + data[offset + 6]) / 3;

                    if (px1 > px2) {
                        currentInt |= (1 << hashIndex);
                    }

                    hashIndex++;
                    if (hashIndex === 4) {
                        hash += currentInt.toString(16);
                        currentInt = 0;
                        hashIndex = 0;
                    }
                }
            }
            return hash;
        }

        // Helper to count bit differences (Hamming Distance)
        function hammingDistance(h1, h2) {
            let dist = 0;
            for (let i = 0; i < h1.length; i++) {
                let v1 = parseInt(h1[i], 16);
                let v2 = parseInt(h2[i], 16);
                let x = v1 ^ v2;
                while (x > 0) {
                    dist += x & 1;
                    x >>= 1;
                }
            }
            return dist;
        }

        async function run() {
            const files = [
                'test images/1770018092150264 (1).jpg',
                'test images/1770018567426243.jpg'
            ];

            const imgs = [];
            for (const src of files) {
                const img = new Image();
                img.src = src;
                await new Promise(r => img.onload = r);
                imgs.push(img);
            }

            const h1 = computeHash(imgs[0]);
            const h2 = computeHash(imgs[1]);
            const dist = hammingDistance(h1, h2);

            const div = document.createElement('div');
            div.className = 'pair';
            div.innerHTML = `
                <div>
                    <div><img src="${files[0]}"><br>${files[0]}</div>
                    <div><img src="${files[1]}"><br>${files[1]}</div>
                </div>
                <div class="info">
                    <h3>Hash Comparison</h3>
                    <p>Image 1: ${h1}</p>
                    <p>Image 2: ${h2}</p>
                    <p>Matches: ${h1 === h2 ? '<span class="match">YES</span>' : '<span class="diff">NO</span>'}</p>
                    <p>Hamming Distance: <b>${dist}</b> (Bits differing)</p>
                    <p>Similarity: ${((64 - dist) / 64 * 100).toFixed(1)}%</p>
                </div>
            `;
            document.getElementById('container').appendChild(div);
        }

        run();
    </script>
</body>

</html>
